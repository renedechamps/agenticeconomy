<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#04060e">
<title>Subscribed — AgenticEconomy.dev</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@400;500;600&display=swap" />
  <style>
    :root {
      --accent: #34d399; --accent-glow: rgba(52,211,153,0.12); --accent-dim: #1a6b4d;
      --bg-deep: #04060e; --border: #1a2348;
      --text-primary: #e8ecf4; --text-secondary: #a0a9c0; --text-muted: #8e99b8;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--bg-deep); color: var(--text-primary); font-family: 'Outfit', sans-serif; font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100vh; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .icon { font-size: 48px; margin-bottom: 24px; }
    h1 { font-family: 'Syne', sans-serif; font-weight: 800; font-size: clamp(28px, 5vw, 44px); margin: 0 0 16px; letter-spacing: -0.02em; }
    p { color: var(--text-secondary); font-size: 17px; max-width: 480px; margin: 0 0 32px; }
    .links { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    a { display: inline-block; padding: 12px 20px; border-radius: 10px; font-weight: 600; font-size: 15px; text-decoration: none; transition: background .18s; }
    .primary { background: var(--accent); color: #062417; }
    .primary:hover { background: #2edabf; }
    .secondary { border: 1px solid var(--border); color: var(--text-secondary); }
    .secondary:hover { color: var(--accent); border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="icon">&#10003;</div>
  <h1>You&#x2019;re in.</h1>
  <p>The Monday Brief lands in your inbox next Monday. Check your spam folder once and add <strong>rene@renedechamps.com</strong> to your contacts so it gets through.</p>
  <div class="links">
    <a class="primary" href="/">Back to the research hub</a>
    <a class="secondary" href="/agentic-economy-101">Start with the 101</a>
  </div>
</body>
</html>
