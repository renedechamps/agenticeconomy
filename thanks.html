<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Sent — Agentic Economy</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg-deep:#04060e; --bg-surface:#0d1117; --accent:#34d399; --text-primary:#e8eaf0; --text-secondary:#8892a4; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg-deep);color:var(--text-primary);font-family:'Outfit',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
  .card{background:var(--bg-surface);border:1px solid rgba(52,211,153,.15);border-radius:16px;padding:3rem 2.5rem;max-width:480px;width:100%;text-align:center}
  .icon{font-size:2.5rem;margin-bottom:1.5rem}
  h1{font-family:'Syne',sans-serif;font-size:1.75rem;margin-bottom:1rem}
  p{color:var(--text-secondary);line-height:1.6;margin-bottom:2rem}
  a{display:inline-block;padding:.75rem 1.5rem;background:rgba(52,211,153,.1);color:var(--accent);border:1px solid rgba(52,211,153,.3);border-radius:8px;text-decoration:none;font-weight:500;transition:background .2s}
  a:hover{background:rgba(52,211,153,.2)}
</style>
</head>
<body>
<div class="card">
  <div class="icon">✓</div>
  <h1>Message received</h1>
  <p>Thank you for reaching out. René will get back to you as soon as possible.</p>
  <a href="/">← Back to AgenticEconomy.dev</a>
</div>
</body>
</html>
